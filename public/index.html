<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Products</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f2f2f2; }
  </style>
</head>
<body>
  <h1>Products (from Database)</h1>
  <p id="status">Loading...</p>
  <table id="table" style="display:none">
    <thead>
      <tr><th>ID</th><th>Name</th><th>Price</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    fetch("/.netlify/functions/getData")
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.error) {
          document.getElementById("status").textContent = "Error: " + data.error;
          return;
        }
        var rows = document.getElementById("rows");
        data.forEach(function (p) {
          var tr = document.createElement("tr");
          tr.innerHTML = "<td>" + p.id + "</td><td>" + p.name + "</td><td>" + p.price + "</td>";
          rows.appendChild(tr);
        });
        document.getElementById("status").style.display = "none";
        document.getElementById("table").style.display = "table";
      })
      .catch(function (err) {
        document.getElementById("status").textContent = "Failed to load: " + err.message;
      });
  </script>
</body>
</html>
